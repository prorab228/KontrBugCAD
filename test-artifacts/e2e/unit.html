// Привязка живёт в SelectionManager — тестируем методы прототипа без редактора.
const snapTarget = Object.create(SelectionManager.prototype);
snapTarget.defaultVertexSnapThreshold = 1;

const results = [];
function check(name, fn) {
    try {
        const detail = fn();
        results.push({ name, pass: true, detail: detail ?? null });
    } catch (error) {
        results.push({ name, pass: false, detail: String(error && (error.message || error)) });
    }
}
function assert(condition, message) {
    if (!condition) throw new Error(message);
}
function assertEqual(actual, expected, message) {
    const a = JSON.stringify(actual);
    const e = JSON.stringify(expected);
    if (a !== e) throw new Error(`${message}: получено ${a}, ожидалось ${e}`);
}

/** Сущность-заглушка: точка/отрезок на плоскости (identity). */
function fakeEntity(uuid, points, plane = new THREE.Object3D()) {
    return {
        userData: { uuid },
        plane,
        getPoints: () => points.map(([x, y, z = 0]) => new THREE.Vector3(x, y, z))
    };
}

// ---------------------------------------------------------------- PathChainUtils

check('sortPathEntities: пустой вход', () => {
    assertEqual(sortPathEntities([]), [], 'результат');
});

check('sortPathEntities: одна сущность', () => {
    const a = fakeEntity('a', [[0, 0], [10, 0]]);
    const chain = sortPathEntities([a]);
    assertEqual(chain.length, 1, 'длина цепочки');
    assert(chain[0].entity === a, 'должна вернуться та же сущность');
    assertEqual(chain[0].reverse, false, 'reverse');
});

check('sortPathEntities: собирает цепочку в правильном порядке', () => {
    // A: 0→10, B: 20→10 (обратный), C: 20→30
    const a = fakeEntity('a', [[0, 0], [10, 0]]);
    const b = fakeEntity('b', [[20, 0], [10, 0]]);
    const c = fakeEntity('c', [[20, 0], [30, 0]]);
    const chain = sortPathEntities([c, a, b]);
    assertEqual(chain.map(item => item.entity.userData.uuid), ['a', 'b', 'c'], 'порядок');
    assertEqual(chain.map(item => item.reverse), [false, true, false], 'направления');
});

check('sortPathEntities: результат не зависит от порядка входа', () => {
    const make = () => [
        fakeEntity('a', [[0, 0], [10, 0]]),
        fakeEntity('b', [[20, 0], [10, 0]]),
        fakeEntity('c', [[20, 0], [30, 0]]),
        fakeEntity('d', [[30, 0], [40, 0]])
    ];
    const first = sortPathEntities(make()).map(i => `${i.entity.userData.uuid}:${i.reverse}`);
    const second = sortPathEntities(make().reverse()).map(i => `${i.entity.userData.uuid}:${i.reverse}`);
    assertEqual(first, second, 'детерминизм');
});

check('sortPathEntities: сущности без точек отбрасываются', () => {
    const a = fakeEntity('a', [[0, 0], [10, 0]]);
    const empty = { userData: { uuid: 'empty' }, plane: new THREE.Object3D(), getPoints: () => [] };
    const chain = sortPathEntities([a, empty]);
    assertEqual(chain.map(item => item.entity.userData.uuid), ['a'], 'осталась одна');
});

check('buildPath3D: склеивает стыки без дублей', () => {

    const b = fakeEntity('b', [[20, 0], [10, 0]]);

    const root = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), material);

    assert(root.material !== material, 'материал должен быть клонирован');

function triangleGeometry() {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        0, 0, 0,
        10, 0, 0,
        0, 10, 0
    ]), 3));
    geometry.setIndex([0, 1, 2]);
    return geometry;
}

function triangleMesh() {
    const mesh = new THREE.Mesh(triangleGeometry(), new THREE.MeshBasicMaterial());
    mesh.updateMatrixWorld();
    return mesh;
}

function round(value, digits = 4) {
    return Number(Number(value).toFixed(digits));
}

// ------------------------------------------- Constraint._resolvePointIndices
// Проверяем, что вынесенный резолвер эквивалентен старому инлайн-коду
// из градиентов (он был скопирован в 5 местах).

const constraintTarget = (pointName) => {
    const instance = Object.create(Constraint.prototype);
    instance.pointName = pointName;
    return instance;
};

/** Эталон — дословно старый инлайн-код из gradient(). */
function referenceResolve(paramIndicesMap, entity, pointName) {
    const pm = paramIndicesMap.get(entity);
    if (!pm) return { idxX: undefined, idxY: undefined };
    let idxX, idxY;
    if (entity.type === 'point') {
        idxX = pm.get('x'); idxY = pm.get('y');
    } else if (entity.type === 'polyline' || entity.type === 'spline') {
        let vidx = -1;
        if (pointName && pointName.startsWith('vertex:')) vidx = parseInt(pointName.split(':')[1]);
        else if (pointName === 'start') vidx = 0;
        else if (pointName === 'end') {
            const pts = entity.type === 'polyline' ? (entity._points || []) : (entity.controlPoints || []);
            vidx = pts.length - 1;
        }
        if (vidx >= 0) {
            idxX = pm.get(`vertex:${vidx}:x`);
            idxY = pm.get(`vertex:${vidx}:y`);
        }
    } else if (pointName === 'start') {
        idxX = pm.get('startX'); idxY = pm.get('startY');
    } else if (pointName === 'end') {
        idxX = pm.get('endX'); idxY = pm.get('endY');
    } else if (pointName === 'center') {
        idxX = pm.get('centerX'); idxY = pm.get('centerY');
    }
    return { idxX, idxY };
}

check('_resolvePointIndices: эквивалентен старому инлайн-коду во всех случаях', () => {
    const cases = [];

    const pointEntity = { type: 'point' };
    cases.push([pointEntity, 'point', ['x', 'y']]);

    const lineEntity = { type: 'line' };
    cases.push([lineEntity, 'start', ['startX', 'startY']]);
    cases.push([lineEntity, 'end', ['endX', 'endY']]);
    cases.push([lineEntity, 'center', ['centerX', 'centerY']]);

    const circleEntity = { type: 'circle' };
    cases.push([circleEntity, 'center', ['centerX', 'centerY']]);

    const polyline = { type: 'polyline', _points: [{}, {}, {}, {}] };
    cases.push([polyline, 'start', ['vertex:0:x', 'vertex:0:y']]);
    cases.push([polyline, 'end', ['vertex:3:x', 'vertex:3:y']]);
    cases.push([polyline, 'vertex:2', ['vertex:2:x', 'vertex:2:y']]);

    const spline = { type: 'spline', controlPoints: [{}, {}, {}] };
    cases.push([spline, 'end', ['vertex:2:x', 'vertex:2:y']]);

    // Неизвестная точка у обычной сущности — параметров нет.
    cases.push([lineEntity, 'vertex:1', []]);

    for (const [entity, pointName, keys] of cases) {
        const map = new Map([[entity, new Map(keys.map((key, index) => [key, index]))]]);
        const actual = constraintTarget(pointName)._resolvePointIndices(map, entity);
        const expected = referenceResolve(map, entity, pointName);
        assertEqual(actual, expected, `случай ${entity.type}/${pointName}`);
    }
});

check('_resolvePointIndices: сущность вне якобиана даёт пустые индексы', () => {
    const entity = { type: 'line' };
    const actual = constraintTarget('start')._resolvePointIndices(new Map(), entity);
    assertEqual(actual, { idxX: undefined, idxY: undefined }, 'нет записи в карте');
});

    assertEqual(byName.type.value, 'inch', 'стандарт');
    assertEqual(byName.position.value, [1, 2, 3], 'позиция из options');
    assertEqual(byName.position.label, 'Позиция резьбы (мм)', 'подпись позиции');

check('updateMinorDiameter: расчёт по стандартам', () => {
    const metric = { diameter: 10, pitch: 1.5, type: 'metric' };
    updateMinorDiameter(metric);
    assertEqual(round(metric.minorDiameter), 8.3762, 'метрическая');

    const trapezoidal = { diameter: 10, pitch: 2, type: 'trapezoidal' };
    updateMinorDiameter(trapezoidal);
    assertEqual(round(trapezoidal.minorDiameter), 7, 'трапецеидальная');

    const pipe = { diameter: 10, pitch: 1.5, type: 'pipe' };
    updateMinorDiameter(pipe);
    assertEqual(round(pipe.minorDiameter), 8.5593, 'трубная');

    const custom = { diameter: 10, pitch: 1.5, type: 'custom' };
    updateMinorDiameter(custom);
    assertEqual(round(custom.minorDiameter), 8.2, 'произвольная');
});

check('applyThreadFieldValues: пишет числа числами и пересчитывает minorDiameter', () => {
    const target = {};

check('applyThreadFieldValues: позиция уходит в onPosition, если он задан', () => {

// ------------------------------------------- GeometryUtils.normalizeFigures (#8)

check('normalizeFigures: плоский массив и форма {points}', () => {
    const fromFlat = GeometryUtils.normalizeFigures([{ outer: [0, 0, 10, 0, 10, 10, 0, 10] }]);
    const fromPoints = GeometryUtils.normalizeFigures([{
        outer: { points: [{ x: 0, y: 0 }, { x: 10, y: 0 }, { x: 10, y: 10 }, { x: 0, y: 10 }] }
    }]);

    assertEqual(fromFlat.length, 1, 'одна фигура');
    assertEqual(fromFlat[0].outer.points.map(p => [p.x, p.y]), [[0, 0], [10, 0], [10, 10], [0, 10]], 'плоский массив');
    assertEqual(fromFlat[0].outer.area, 100, 'площадь');
    assertEqual(fromFlat[0].outer.isClockwise, false, 'внешний контур против часовой');
    assertEqual(fromPoints[0].outer.points.length, 4, 'форма {points} даёт те же 4 точки');
});

check('normalizeFigures: контур в виде массива пар (регрессия)', () => {
    // Раньше такие фигуры молча отбрасывались: revolve, loft и sweep
    // возвращали успех, но не создавали объект.
    const result = GeometryUtils.normalizeFigures([{ outer: [[0, 0], [10, 0], [10, 10], [0, 10]] }]);
    assertEqual(result.length, 1, 'фигура не должна теряться');
    assertEqual(result[0].outer.points.map(p => [p.x, p.y]), [[0, 0], [10, 0], [10, 10], [0, 10]], 'точки');
    assertEqual(result[0].outer.area, 100, 'площадь');
});

check('normalizeFigures: отверстие разворачивается по часовой', () => {
    // Внешний контур CCW, отверстие тоже CCW — нормализатор должен его развернуть.
    const [figure] = GeometryUtils.normalizeFigures([{
        outer: [0, 0, 20, 0, 20, 20, 0, 20],
        holes: [[5, 5, 15, 5, 15, 15, 5, 15]]
    }]);
    assertEqual(figure.holes.length, 1, 'одно отверстие');
    assertEqual(figure.holes[0].isClockwise, true, 'отверстие по часовой');
    assertEqual(figure.holes[0].area, 100, 'площадь отверстия');

    const points = figure.holes[0].points.map(p => [p.x, p.y]);
    assertEqual(points, [[5, 15], [15, 15], [15, 5], [5, 5]], 'точки развёрнуты');
});

check('normalizeFigures: уже часовое отверстие не переворачивается', () => {
    const [figure] = GeometryUtils.normalizeFigures([{
        outer: [0, 0, 20, 0, 20, 20, 0, 20],
        holes: [[5, 15, 15, 15, 15, 5, 5, 5]] // по часовой
    }]);
    assertEqual(figure.holes[0].points.map(p => [p.x, p.y]), [[5, 15], [15, 15], [15, 5], [5, 5]], 'порядок сохранён');
    assertEqual(figure.holes[0].area, 100, 'площадь');
});

check('normalizeFigures: некорректные фигуры пропускаются', () => {
    const result = GeometryUtils.normalizeFigures([
        { outer: [0, 0, 1, 1] },        // меньше 3 точек
        { outer: null },                // нет контура
        { outer: [0, 0, 10, 0, 0, 10] } // валидная
    ]);
    assertEqual(result.length, 1, 'осталась одна фигура');
});

// ------------------------------------------------ Preview-материалы и сцена

check('markPreviewClone: помечает клон как превью', () => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial());
    mesh.castShadow = true;
    markPreviewClone(mesh);

    assertEqual(mesh.userData.isPreview, true, 'isPreview');
    assertEqual(mesh.userData.isTemporary, true, 'isTemporary');
    assertEqual(mesh.castShadow, false, 'castShadow');
    assertEqual(mesh.receiveShadow, false, 'receiveShadow');
    assertEqual(round(mesh.material.opacity), 0.4, 'прозрачность');
    assertEqual(mesh.material.transparent, true, 'transparent');
});

check('disposeObject3D: убирает из родителя и освобождает ресурсы', () => {
    const parent = new THREE.Group();
    const root = new THREE.Group();
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshStandardMaterial();
    const mesh = new THREE.Mesh(geometry, material);
    root.add(mesh);
    parent.add(root);

    let geometryDisposed = false;
    let materialDisposed = false;
    geometry.addEventListener('dispose', () => { geometryDisposed = true; });
    material.addEventListener('dispose', () => { materialDisposed = true; });

    disposeObject3D(root, parent);

    assertEqual(parent.children.length, 0, 'родитель очищен');
    assertEqual(geometryDisposed, true, 'geometry.dispose');
    assertEqual(materialDisposed, true, 'material.dispose');
});

check('disposeObject3D: массив материалов и пустой вход', () => {
    const root = new THREE.Group();
    const m1 = new THREE.MeshBasicMaterial();
    const m2 = new THREE.MeshBasicMaterial();
    let disposed = 0;
    m1.addEventListener('dispose', () => { disposed++; });
    m2.addEventListener('dispose', () => { disposed++; });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), [m1, m2]);
    root.add(mesh);

    disposeObject3D(root);
    assertEqual(disposed, 2, 'оба материала освобождены');

    disposeObject3D(null);
    disposeObject3D(undefined, null);
});

// ------------------------------------------- TransformToolBase (move/rotate/scale)

function transformStub({ attached = [], local = true, axisColors = null } = {}) {
    const stub = Object.create(TransformToolBase.prototype);
    stub.attachedObjects = attached;
    stub.useLocalCoordinates = local;
    stub.baseDimensionsMap = new Map();
    stub.axisColors = axisColors;
    return stub;
}

check('computeGizmoSize: локальный режим берёт базовые размеры с масштабом', () => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1));
    mesh.scale.set(2, 3, 4);
    const tool = transformStub({ attached: [mesh], local: true });
    tool.baseDimensionsMap.set(mesh.uuid, new THREE.Vector3(1, 2, 3));

    const size = tool.computeGizmoSize();

// -------------------------------------- Градиенты ограничений эскиза (численно)

/** Точка-сущность с параметрами x/y. */
function makePointEntity(params = { x: 3, y: 4 }) {
    return { type: 'point', params: { ...params } };
}

/** Отрезок с параметрами startX/startY/endX/endY. */
function makeLineEntity(params = { startX: 0, startY: 0, endX: 10, endY: 0 }) {
    return {
        type: 'line',
        params: { ...params },
        get start() { return new THREE.Vector3(this.params.startX, this.params.startY, 0); },
        get end() { return new THREE.Vector3(this.params.endX, this.params.endY, 0); }
    };
}

const PARAM_KEYS = {
    point: ['x', 'y'],
    line: ['startX', 'startY', 'endX', 'endY'],
    circle: ['centerX', 'centerY', 'radius']
};

function buildParamIndices(entities) {
    const paramIndicesMap = new Map();
    const entries = [];
    let index = 0;

    for (const entity of entities) {
        const map = new Map();
        for (const key of PARAM_KEYS[entity.type] || []) {
            map.set(key, index);
            entries.push({ entity, key, index });
            index++;
        }
        paramIndicesMap.set(entity, map);
    }

    return { paramIndicesMap, entries };
}

/**
 * Сверяет аналитический градиент ограничения с центральной разностью по каждому параметру.
 * Так проверяется, что вынос формул в общие методы не изменил значения и знаки.
 */
function assertGradientMatchesNumeric(constraint, entities, tolerance = 1e-4) {
    const { paramIndicesMap, entries } = buildParamIndices(entities);
    const grad = constraint.gradient(paramIndicesMap);
    const h = 1e-6;

    for (const { entity, key, index } of entries) {
        const original = entity.params[key];

        entity.params[key] = original + h;
        const plus = constraint.error();
        entity.params[key] = original - h;
        const minus = constraint.error();
        entity.params[key] = original;

        const numeric = (plus - minus) / (2 * h);
        const analytical = grad.get(index) ?? 0;

        if (!Number.isFinite(analyticSafe(analytical)) || Math.abs(numeric - analytical) > tolerance) {
            throw new Error(`${key}: численно ${numeric.toFixed(6)}, аналитически ${String(analytical)}`);
        }
    }

    return [...grad.keys()].length + ' индексов';
}

function analyticSafe(value) {
    return value === undefined ? 0 : value;
}

check('PointLineDistanceConstraint: градиент = численная производная', () => {
    const point = makePointEntity();
    const line = makeLineEntity();
    const constraint = new PointLineDistanceConstraint(point, 'point', line, 2);
    return assertGradientMatchesNumeric(constraint, [point, line]);
});

check('PointOnLineConstraint: градиент = численная производная', () => {
    const point = makePointEntity();
    const line = makeLineEntity();
    const constraint = new PointOnLineConstraint(point, 'point', line);
    return assertGradientMatchesNumeric(constraint, [point, line]);
});

check('point-to-line градиент: точка на другой стороне прямой (знак)', () => {
    const below = makePointEntity({ x: 3, y: -4 });
    const line = makeLineEntity();
    const constraint = new PointLineDistanceConstraint(below, 'point', line, 2);
    return assertGradientMatchesNumeric(constraint, [below, line]);
});

});
